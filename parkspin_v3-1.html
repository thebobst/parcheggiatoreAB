<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ParcheggioAPPiacere</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root {
  --acc: #00c980;
  --acc2: #ff5f2e;
  --acc-app: #ff9f1c;
  --bg: #0e0e10;
  --surface: #1a1a1f;
  --surface2: #25252d;
  --text: #f0f0f0;
  --muted: #888;
  --border: #2a2a35;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.logo { font-size: 16px; font-weight: 700; font-family: monospace; }
.logo span { color: var(--acc-app); }
.badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); font-family: monospace; transition: all 0.3s; }
.badge.active { border-color: var(--acc); color: var(--acc); }
#map { flex: 1; }
.panel { background: var(--surface); border-top: 1px solid var(--border); padding: 14px 16px; flex-shrink: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface2); border-radius: 8px; padding: 8px 10px; }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.stat-value { font-size: 15px; font-weight: 600; font-family: monospace; color: var(--acc); }
.progress { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--acc); border-radius: 2px; width: 0%; transition: width 0.8s ease; }
.msg { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 10px; min-height: 16px; font-family: monospace; }
.msg.ok { color: var(--acc); }
.msg.err { color: var(--acc2); }
.btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.1s; font-family: inherit; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-start { background: var(--acc); color: #0e0e10; }
.btn-stop  { background: var(--acc2); color: #fff; }
.btn-sec   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-top: 8px; }

/* Settings drawer */
.drawer { background: var(--surface2); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: none; }
.drawer.open { display: block; }
.drawer-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.drawer-row:last-child { margin-bottom: 0; }
.drawer-label { font-size: 12px; color: var(--muted); }
.drawer-val { font-size: 12px; font-family: monospace; color: var(--acc); min-width: 40px; text-align: right; }
input[type=range] { flex: 1; margin: 0 10px; accent-color: var(--acc); }
.toggle-wrap { display: flex; gap: 6px; }
.toggle-btn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: monospace; transition: all 0.2s; }
.toggle-btn.on { border-color: var(--acc); color: var(--acc); background: rgba(0,201,128,0.08); }
.leaflet-control-zoom { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">Parcheggio<span>APP</span>iacere</div>
  <div class="badge" id="badge">In attesa</div>
</header>

<div id="map"></div>

<div class="panel">
  <div class="stats">
    <div class="stat"><div class="stat-label">Distanza</div><div class="stat-value" id="sDist">— m</div></div>
    <div class="stat"><div class="stat-label">Giro</div><div class="stat-value" id="sLoop">0</div></div>
    <div class="stat"><div class="stat-label">Strade</div><div class="stat-value" id="sRoads">0</div></div>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-row">
      <span class="drawer-label">Raggio massimo</span>
      <input type="range" id="sliderRadius" min="200" max="1500" step="100" value="700" oninput="document.getElementById('valRadius').textContent=this.value+'m'">
      <span class="drawer-val" id="valRadius">700m</span>
    </div>
    <div class="drawer-row">
      <span class="drawer-label">Tipo strade</span>
      <div class="toggle-wrap">
        <button class="toggle-btn on" id="btnRes" onclick="toggleRoad('residential')">Residenziali</button>
        <button class="toggle-btn on" id="btnSec" onclick="toggleRoad('secondary')">Secondarie</button>
        <button class="toggle-btn" id="btnPri" onclick="toggleRoad('primary')">Principali</button>
      </div>
    </div>
  </div>

  <div class="progress"><div class="progress-fill" id="prog"></div></div>
  <div class="msg" id="msg">Premi START per iniziare</div>
  <button class="btn btn-start" id="btnMain" onclick="handleMain()">▶ START</button>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn btn-sec" style="flex:1" onclick="toggleDrawer()">⚙ Impostazioni</button>
    <button class="btn btn-sec" style="flex:1;display:none" id="btnMaps" onclick="openMaps()">↗ Google Maps</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────
const ROAD_FILTERS = {
  residential: true,
  secondary: true,
  primary: false
};

const LOOP_COLORS = ['#00c980','#00d4b8','#00aaff','#7c6fff','#d946c2','#ff5f2e','#ffaa00'];

// ── State ─────────────────────────────────────────────────────────────────
let map, originMarker, routeGroup;
let state = 'idle';
let origin = null;
let loopN = 0;
let fetchTimer = null;
let allRoutePoints = [];
let visitedSegments = new Set();
let totalRoads = 0;

// ── Map init ──────────────────────────────────────────────────────────────
function initMap(lat, lng) {
  if (map) { map.setView([lat, lng], 17); return; }
  map = L.map('map', { zoomControl: false, attributionControl: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd'
  }).addTo(map);
  routeGroup = L.layerGroup().addTo(map);
  map.setView([lat, lng], 17);
}

function placeOrigin(lat, lng) {
  if (originMarker) map.removeLayer(originMarker);
  const icon = L.divIcon({
    html: `<div style="width:16px;height:16px;border-radius:50%;background:#00c980;border:3px solid #fff;box-shadow:0 0 0 5px rgba(0,201,128,0.25)"></div>`,
    className: '', iconSize: [16,16], iconAnchor: [8,8]
  });
  originMarker = L.marker([lat, lng], { icon }).addTo(map);
}

// ── OSM road fetching ─────────────────────────────────────────────────────
async function fetchOSMRoads(lat, lng, radius) {
  // Build highway filter based on settings
  const types = [];
  if (ROAD_FILTERS.residential) types.push('"residential"', '"living_street"', '"unclassified"');
  if (ROAD_FILTERS.secondary)   types.push('"secondary"', '"tertiary"', '"secondary_link"', '"tertiary_link"');
  if (ROAD_FILTERS.primary)     types.push('"primary"', '"primary_link"', '"trunk"');

  const filter = types.join('|').replace(/"/g,'');
  const query = `
    [out:json][timeout:15];
    (
      way["highway"~"^(${filter})$"]["access"!="private"]["motor_vehicle"!="no"]
        (around:${radius},${lat},${lng});
    );
    out geom;
  `;
  const res = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent(query)
  });
  const data = await res.json();
  return data.elements || [];
}

// ── Smart routing algorithm ───────────────────────────────────────────────
function haversine(a, b) {
  const R = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function segmentKey(a, b) {
  // Direction-aware key for one-way awareness
  return `${a.lat.toFixed(5)},${a.lng.toFixed(5)}>${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
}

function buildGraph(ways, origin) {
  // Build adjacency graph from OSM ways
  const nodes = {}; // id -> {lat,lng}
  const edges = []; // {from, to, dist, oneway, highway}

  ways.forEach(way => {
    const geom = way.geometry;
    if (!geom || geom.length < 2) return;
    const oneway = way.tags && (way.tags.oneway === 'yes' || way.tags.junction === 'roundabout');
    const highway = way.tags && way.tags.highway;

    for (let i = 0; i < geom.length; i++) {
      const id = `${geom[i].lat.toFixed(6)},${geom[i].lon.toFixed(6)}`;
      nodes[id] = { lat: geom[i].lat, lng: geom[i].lon };
    }

    for (let i = 0; i < geom.length - 1; i++) {
      const fromId = `${geom[i].lat.toFixed(6)},${geom[i].lon.toFixed(6)}`;
      const toId   = `${geom[i+1].lat.toFixed(6)},${geom[i+1].lon.toFixed(6)}`;
      const from = { lat: geom[i].lat, lng: geom[i].lon };
      const to   = { lat: geom[i+1].lat, lng: geom[i+1].lon };
      const dist = haversine(from, to);
      edges.push({ fromId, toId, from, to, dist, oneway, highway });
      if (!oneway) edges.push({ fromId: toId, toId: fromId, from: to, to: from, dist, oneway, highway });
    }
  });

  return { nodes, edges };
}

function scoreEdge(edge, origin, visitedSegments, maxRadius) {
  const toNode = edge.to;
  const distFromOrigin = haversine(toNode, origin);

  // Penalize if too far from origin
  if (distFromOrigin > maxRadius) return Infinity;

  let score = 0;

  // 1. PRIORITY: stay close to origin (most important)
  score += distFromOrigin * 2.5;

  // 2. Penalize already visited segments
  const key = segmentKey(edge.from, edge.to);
  if (visitedSegments.has(key)) score += 800;

  // 3. Penalize one-way roads that lead away from origin
  if (edge.oneway) {
    const awayAngle = Math.atan2(toNode.lat - origin.lat, toNode.lng - origin.lng);
    const fromAngle = Math.atan2(edge.from.lat - origin.lat, edge.from.lng - origin.lng);
    const diff = Math.abs(awayAngle - fromAngle);
    if (diff > Math.PI / 2 && diff < 3 * Math.PI / 2) score += 400; // leading away
  }

  // 4. Prefer residential/living_street (more parking)
  if (edge.highway === 'residential' || edge.highway === 'living_street') score -= 50;
  if (edge.highway === 'primary' || edge.highway === 'trunk') score += 100;

  return score;
}

function buildSpiralRoute(graph, origin, maxRadius, loop) {
  // Greedy nearest-unvisited algorithm with spiral expansion
  const { edges } = graph;

  // Build adjacency map
  const adj = {};
  edges.forEach(e => {
    if (!adj[e.fromId]) adj[e.fromId] = [];
    adj[e.fromId].push(e);
  });

  // Find closest node to origin as start
  let startId = null;
  let minDist = Infinity;
  Object.entries(graph.nodes).forEach(([id, node]) => {
    const d = haversine(node, origin);
    if (d < minDist) { minDist = d; startId = id; }
  });

  if (!startId) return [];

  // Target radius for this loop — grows faster
  const targetRadius = 100 + (loop - 1) * 120;

  const path = [graph.nodes[startId]];
  const localVisited = new Set();
  let currentId = startId;
  let steps = 0;
  const maxSteps = 120;

  while (steps < maxSteps) {
    const neighbors = adj[currentId] || [];
    if (!neighbors.length) break;

    // Score all neighbors
    let best = null;
    let bestScore = Infinity;

    neighbors.forEach(edge => {
      // Skip if dist from origin > maxRadius
      const d = haversine(edge.to, origin);
      if (d > maxRadius) return;

      let score = scoreEdge(edge, origin, visitedSegments, maxRadius);

      // Bonus for hitting target radius ring (spiral expansion)
      const distDiff = Math.abs(d - targetRadius);
      score += distDiff * 0.5;

      // Penalize locally visited in this path
      const localKey = segmentKey(edge.from, edge.to);
      if (localVisited.has(localKey)) score += 500;

      if (score < bestScore) { bestScore = score; best = edge; }
    });

    if (!best || bestScore === Infinity) break;

    path.push(best.to);
    const key = segmentKey(best.from, best.to);
    localVisited.add(key);
    visitedSegments.add(key);
    currentId = best.toId;
    steps++;

    // Try to close the loop back to start after enough steps
    if (steps > 20) {
      const distToStart = haversine(graph.nodes[currentId] || best.to, path[0]);
      if (distToStart < 100) {
        path.push(path[0]); // close loop
        break;
      }
    }
  }

  return path;
}

// ── Main loop ─────────────────────────────────────────────────────────────
async function runLoop(loopNum) {
  if (state !== 'running') return;

  const maxRadius = parseInt(document.getElementById('sliderRadius').value);
  const currentRadius = Math.min(80 + (loopNum - 1) * 65, maxRadius);

  setMsg('Giro ' + loopNum + ' — scarico strade OSM...', '');

  try {
    const ways = await fetchOSMRoads(origin.lat, origin.lng, currentRadius);
    if (!ways.length) {
      setMsg('Nessuna strada trovata, espando...', 'err');
      if (state === 'running' && currentRadius < maxRadius)
        fetchTimer = setTimeout(() => runLoop(loopNum + 1), 1500);
      return;
    }

    const graph = buildGraph(ways, origin);
    const path = buildSpiralRoute(graph, origin, currentRadius, loopNum);

    if (path.length > 1) {
      const color = LOOP_COLORS[Math.min(loopNum - 1, LOOP_COLORS.length - 1)];
      const latlngs = path.map(p => [p.lat, p.lng]);
      L.polyline(latlngs, { color, weight: 4, opacity: 0.85, lineCap: 'round', lineJoin: 'round' }).addTo(routeGroup);
      allRoutePoints = allRoutePoints.concat(latlngs);

      totalRoads += ways.length;
      document.getElementById('sDist').textContent = Math.round(currentRadius) + ' m';
      document.getElementById('sLoop').textContent = loopNum;
      document.getElementById('sRoads').textContent = totalRoads;
      document.getElementById('prog').style.width = Math.min((currentRadius / maxRadius) * 90, 90) + '%';
      setMsg('Giro ' + loopNum + ' completato — ' + path.length + ' nodi', 'ok');
    }

    if (state === 'running' && currentRadius < maxRadius) {
      fetchTimer = setTimeout(() => runLoop(loopNum + 1), 3000);
    } else if (currentRadius >= maxRadius) {
      setMsg('Raggio massimo raggiunto. Premi STOP se hai trovato parcheggio.', 'ok');
    }

  } catch(e) {
    console.error(e);
    setMsg('Errore rete, riprovo...', 'err');
    if (state === 'running') fetchTimer = setTimeout(() => runLoop(loopNum), 3500);
  }
}

// ── Controls ──────────────────────────────────────────────────────────────
function handleMain() {
  if (state === 'idle') startSession();
  else if (state === 'running') stopSession();
}

function startSession() {
  state = 'loading';
  setMsg('Rilevamento GPS...', '');
  document.getElementById('btnMain').disabled = true;

  navigator.geolocation.getCurrentPosition(pos => {
    origin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    begin();
  }, () => {
    origin = { lat: 43.7696, lng: 11.2558 };
    setMsg('GPS non disponibile — demo su Firenze', 'err');
    begin();
  }, { enableHighAccuracy: true, timeout: 8000 });
}

function begin() {
  visitedSegments = new Set();
  allRoutePoints = [];
  totalRoads = 0;
  loopN = 1;
  state = 'running';
  initMap(origin.lat, origin.lng);
  placeOrigin(origin.lat, origin.lng);
  if (routeGroup) routeGroup.clearLayers();
  document.getElementById('btnMain').textContent = '■ STOP — trovato parcheggio!';
  document.getElementById('btnMain').className = 'btn btn-stop';
  document.getElementById('btnMain').disabled = false;
  document.getElementById('badge').textContent = 'Ricerca';
  document.getElementById('badge').className = 'badge active';
  runLoop(1);
}

function stopSession() {
  state = 'done';
  clearTimeout(fetchTimer);
  document.getElementById('btnMain').textContent = '✓ Parcheggio trovato!';
  document.getElementById('btnMain').disabled = true;
  document.getElementById('btnMaps').style.display = 'block';
  document.getElementById('badge').textContent = 'Completato';
  document.getElementById('badge').className = 'badge';
  document.getElementById('prog').style.width = '100%';
  setMsg('Ottimo! Percorso salvato.', 'ok');
}

function openMaps() {
  if (allRoutePoints.length < 2) return;
  const sample = sampleArr(allRoutePoints, 8);
  const orig = sample[0].join(',');
  const dest = sample[sample.length-1].join(',');
  const wps = sample.slice(1,-1).map(p => p.join(',')).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${orig}&destination=${dest}&travelmode=driving`;
  if (wps) url += `&waypoints=${wps}`;
  window.open(url, '_blank');
}

function sampleArr(arr, n) {
  if (arr.length <= n) return arr;
  const step = Math.floor(arr.length / n);
  return Array.from({length: n}, (_, i) => arr[i * step]);
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
}

function toggleRoad(type) {
  ROAD_FILTERS[type] = !ROAD_FILTERS[type];
  const id = type === 'residential' ? 'btnRes' : type === 'secondary' ? 'btnSec' : 'btnPri';
  document.getElementById(id).classList.toggle('on', ROAD_FILTERS[type]);
}

function setMsg(t, cls) {
  const el = document.getElementById('msg');
  el.textContent = t;
  el.className = 'msg' + (cls ? ' ' + cls : '');
}
</script>
</body>
</html>
